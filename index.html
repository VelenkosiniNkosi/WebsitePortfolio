<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="refresh"
    content="3; url=https://velenkosininkosi.vercel.app/"
  />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Redirecting | Velenkosini Nkosi</title>

  <script>
    setTimeout(() => {
      window.location.href = "https://velenkosininkosi.vercel.app/";
    }, 3000);
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      padding: 50px 40px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 90%;
    }

    .logo {
      font-size: 60px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 15px;
      color: #ffffff;
    }

    p {
      color: #cbd5e1;
      line-height: 1.6;
      margin-bottom: 25px;
      font-size: 1rem;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: #38bdf8;
      color: #0f172a;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.3s ease;
    }

    .btn:hover {
      background: #0ea5e9;
      transform: translateY(-2px);
    }

    .loader {
      margin: 25px auto 0;
      width: 45px;
      height: 45px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    .small-text {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="logo">🚀</div>

    <h1>Portfolio Moved</h1>

    <p>
      My portfolio website has moved to a new and improved location.
      You’ll be redirected automatically in a few seconds.
    </p>

    <a
      class="btn"
      href="https://velenkosininkosi.vercel.app/"
    >
      Visit New Portfolio
    </a>

    <div class="loader"></div>

    <p class="small-text">
      Redirecting securely to Vercel hosting...
    </p>
  </div>
</body>
</html>
